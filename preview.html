function hydrateHisnPack(pack){
  if(!pack||typeof pack!=='object'||Array.isArray(pack))throw Error('Unexpected Hisnul Muslim data');
  const chapters=Object.entries(pack).filter(([k,v])=>v&&Array.isArray(v.Adhkar));
  if(chapters.length<100||chapters.length>160)throw Error('Unexpected chapter count');
  for(let i=0;i<chapters.length;i++){
    const [title,chapter]=chapters[i];const ids=[];
    for(let j=0;j<chapter.Adhkar.length;j++){
      const rec=chapter.Adhkar[j];if(typeof rec?.Text!=='string'||!rec.Text.trim())continue;
      const id='hisn-'+(i+1)+'-'+(j+1);
      if(LOOK[id])continue;
      const item={id,name:'Hisnul Muslim • '+(i+1)+'.'+(j+1),ms:'حصن المسلم • '+(i+1)+'.'+(j+1),ar:rec.Text,en:'',msText:'',tr:'',ref:String(rec.Reference||'Hisnul Muslim chapter '+(i+1)),kind:'hisn',tags:['hisnul','arabic'],repeat:Math.round(clamp(rec.Count||1,1,100)),note:'Imported Arabic-only source content; text, counts and references require editorial checking.'};
      LOOK[id]=item;ITEMS.push(item);ids.push(id);

    hisnChapterIds.push(cid);
  }
}

const SEARCH_INTENTS=[
 [/exam|peperiksaan|ujian|study|belajar|school|sekolah|knowledge|ilmu|revision|ulang kaji/,['study','knowledge']],
 [/worried|worry|anxious|anxiety|stress|stressed|risau|bimbang|gelisah|sedih|distress|fear|takut|خوف|قلق/,['anxiety','hardship','trust']],
 [/hospital|sick|illness|health|kesihatan|sakit|sembuh|healing/,['health','protection']],
 [/mother|father|parent|ibu|bapa|ayah|family|keluarga|child|anak|husband|wife/,['parents','family','children']],
 [/trip|car|drive|travel|journey|musafir|perjalanan|kereta|kenderaan/,['travel','journey']],
 [/work|job|interview|kerja|tugas|speech|berucap/,['work','study']],
 [/bed|sleep|tidur|malam|night/,['sleep','night']],
 [/meal|food|makan|drink|eating/,['food']],
 [/repent|forgive|ampun|dosa|istighfar/,['repentance']],
 [/morning|pagi|subuh/,['morning','waking']],
 [/evening|petang|senja/,['evening']],
 [/prayer|salah|solat|namaz/,['after-salah','prayer']]
];
function matched(){
 const q=normalized(searchTerm);const intents=SEARCH_INTENTS.flatMap(([pattern,tags])=>pattern.test(q)?tags:[]);
 const words=q.split(/\s+/).filter(w=>w.length>=4&&!['about','untuk','yang','with','dalam','saya','from','want','need','when'].includes(w));
 return ITEMS.filter(x=>{
  if(searchTag!=='all'&&x.kind!==searchTag&&!x.tags.includes(searchTag))return false;
  if(!q)return true;
  const hay=normalized([x.name,x.ms,x.ar,x.en,x.msText,x.tr,x.ref,...x.tags].join(' '));
  return hay.includes(q)||intents.some(tag=>x.tags.includes(tag))||words.some(w=>hay.includes(w));
 });
}
function itemRow(x,i,collectionId){let link=collectionId?`data-open="${h(collectionId)}" data-index="${i}"`:`data-single="${h(x.id)}"`;return `<button class="item-row" ${link}><span class="item-num">${String(i+1).padStart(2,'0')}</span><span class="item-info"><strong>${h(getName(x))}</strong><small>${h(x.ref)} · ${x.repeat}× · ${h(x.tags.slice(0,2).join(', '))}</small></span><span class="item-arrow">→</span></button>`}
function exploreResults(){return `<p class="tagline"><b>${matched().length}</b> ${h(L('results'))}</p><div class="item-list">${matched().length?matched().map((x,i)=>itemRow(x,i)).join(''):`<div class="empty-state">${h(L('empty'))}</div>`}</div>`}
function renderExplore(){return `<div class="main-body"><div class="searchbar"><span class="mag">⌕</span><input id="search" autocomplete="off" placeholder="${h(L('searchPlaceholder'))}" value="${h(searchTerm)}" aria-label="Search supplications"></div><div class="chips" id="search-chips">${TAGS.map(([tag,key])=>`<button class="chip ${searchTag===tag?'selected':''}" data-tag="${tag}">${h(L(key))}</button>`).join('')}</div><div id="explore-results">${exploreResults()}</div></div>`}
function renderSaved(){let bm=state.bookmarks.map(id=>LOOK[id]).filter(Boolean);return `<div class="main-body"><div class="chips"><button data-savedtab="bookmarks" class="chip ${savedTab==='bookmarks'?'selected':''}">☆ ${h(L('navSaved'))} (${bm.length})</button><button data-savedtab="custom" class="chip ${savedTab==='custom'?'selected':''}">◈ ${h(L('newCollection'))} (${state.custom.length})</button></div>${savedTab==='bookmarks'?`<div class="item-list">${bm.length?bm.map((it,i)=>itemRow(it,i)).join(''):`<div class="empty-state"><strong>${h(L('noSaved'))}</strong>${h(L('savedHint'))}</div>`}</div>`:`<div class="settings-group"><h3>${h(L('newCollection'))}</h3><form class="inline-form" id="custom-form"><input required class="input" id="custom-name" maxlength="60" placeholder="${h(L('collectionName'))}"><button class="btn primary" type="submit">${h(L('create'))}</button></form></div><div class="saved-collections" style="margin-top:17px">${state.custom.length?state.custom.map(c=>`<div class="item-row"><div class="item-info"><strong>${h(c.name)}</strong><small>${c.items.length} ${h(L('items'))}</small></div><button class="btn soft small" data-open="${h(c.id)}">${h(L('read'))}</button><button class="btn small danger" data-delete-custom="${h(c.id)}">${h(L('remove'))}</button></div>`).join(''):`<div class="empty-state">${h(L('nothing'))}</div>`}</div>`}</div>`}
function readerCard(it,c,idx,mode){const ck=c||'single:'+it.id,amt=amount(ck,it.id),saved=state.bookmarks.includes(it.id);const isMem=mode==='memorise';let visibleArabic=state.settings.arabic&&(!isMem||memoriseRevealed);return `<article class="reader-card" data-entry="${h(it.id)}"><div class="reader-top"><div><span class="pill">${it.kind==='quran'?'QUR’AN':it.kind==='hisn'?'HISN':'SUNNAH'} &nbsp; · &nbsp; ${it.repeat}×</span><h3 style="margin-top:12px">${h(getName(it))}</h3><p>${h(it.ref)}</p></div><div class="reader-tools"><button class="small-icon ${saved?'saved':''}" data-bookmark="${h(it.id)}" aria-label="Bookmark" title="Save">${saved?'★':'☆'}</button><button class="small-icon" data-speak="${h(it.id)}" title="${h(L('spoken'))}" aria-label="Speak Arabic">♫</button></div></div>${visibleArabic?`<div class="arabic-text" lang="ar" dir="rtl">${h(it.ar)}</div>`:isMem?`<div class="empty-state" style="padding:31px 14px"><button class="btn soft" data-reveal="1">${h(L('reveal'))}</button></div>`:''}${state.settings.transliteration?`<div class="translit">${h(it.tr)}</div>`:''}${state.settings.translation?`<div class="field-label">${h(L('translation'))}</div><p class="translation-text">${h(getMeaning(it)||L('translationPending'))}</p>`:''}<div class="source-line"><strong>${h(L('source'))}:</strong> ${h(it.ref)}${it.note?`<br>${h(it.note)}`:''}<div>${h(L('referenceNote'))}</div></div><div class="count-area"><div><small>${h(L('count'))}</small><span class="count-value" data-count-display="${h(it.id)}">${amt} <span class="muted" style="font-size:13px">/ ${it.repeat}</span></span></div><div class="btn-row"><button class="btn small" data-reset-counter="${h(it.id)}">↺</button><button class="btn primary" data-increment="${h(it.id)}" ${amt>=it.repeat?'disabled':''}>${amt>=it.repeat?'✓ '+h(L('done')):'+1 '+h(L('count'))}</button></div></div><div class="btn-row" style="margin-top:12px"><button class="btn small soft" data-add-item="${h(it.id)}">＋ ${h(L('addTo'))}</button>${isMem&&memoriseRevealed?`<button class="btn small" data-hide="1">${h(L('hide'))}</button>`:''}</div></article>`}
function readerOptions(){return `<div class="reader-aside"><h3>${h(L('readMode'))}</h3><div class="segments">${[['guided','guided'],['continuous','continuous'],['memorise','memorise']].map(([v,key])=>`<button class="segment ${state.settings.readerMode===v?'active':''}" data-mode="${v}">${h(L(key))}</button>`).join('')}</div><h3 style="margin-top:22px">${h(L('textVisibility'))}</h3><div class="reading-options">${[['arabic','arabic'],['translation','translation'],['transliteration','transliteration']].map(([key,label])=>`<label class="toggle-row">${h(L(label))}<input type="checkbox" data-visibility="${key}" ${state.settings[key]?'checked':''}></label>`).join('')}</div><div class="reader-counter">${h(L('speechNote'))}</div></div>`}
function renderReader(){const c=collection(openCollection);if(!c)return `<div class="main-body">${h(L('nothing'))}</div>`;let list=c.items.filter(id=>LOOK[id]);let mode=state.settings.readerMode;const all=mode==='continuous';let current=LOOK[list[openIndex]]||LOOK[list[0]];let percentage=progress(c.id);return `<div class="main-body"><button class="breadcrumb" data-nav="${c.id.startsWith('custom:')?'saved':'library'}">← ${h(L('back'))} / ${h(colName(c))}</button><div class="collection-head"><div><h2>${h(colName(c))}</h2><p>${h(colSub(c))}</p></div><button class="btn soft small" data-session-finish="${h(c.id)}">✓ ${h(L('complete'))}</button></div>${c.draft?`<div class="notice">${h(L('collectionDraft'))}</div>`:''}<div class="progress-track"><div class="progress-fill" style="width:${percentage}%"></div></div><p class="tagline" style="margin:0 0 17px">${h(L('sessionProgress'))}: ${percentage}% &nbsp; · &nbsp; ${list.length} ${h(L('items'))}</p><div class="reader-layout"><div class="reader-main">${all?`<div class="reading-stream">${list.map((id,i)=>readerCard(LOOK[id],c.id,i,mode)).join('')}</div>`:readerCard(current,c.id,openIndex,mode)}<div class="reader-controls">${all?`<button class="btn" data-reset-session="${h(c.id)}">↺ ${h(L('reset'))}</button>`:`<button class="btn" data-prev="1" ${openIndex<=0?'disabled':''}>← ${h(L('previous'))}</button><span class="pill">${openIndex+1} / ${list.length}</span><button class="btn primary" data-next="1">${openIndex===list.length-1?h(L('complete')):h(L('next'))} →</button>`}</div></div>${readerOptions()}</div></div>`}
function renderSingle(){const it=LOOK[focusId];return `<div class="main-body"><button class="breadcrumb" data-nav="explore">← ${h(L('back'))} / ${h(L('navExplore'))}</button><div class="reader-layout"><div>${readerCard(it,null,0,state.settings.readerMode)}</div>${readerOptions()}</div></div>`}
function renderSettings(){const s=state.settings;return `<div class="main-body stack"><section class="settings-group"><h3>◐ &nbsp; ${h(L('appearance'))}</h3><p>${h(L('appearanceHelp'))}</p><div class="setting-row"><div><label>${h(L('theme'))}</label><small>${h(L('system'))} / ${h(L('light'))} / ${h(L('dark'))}</small></div><div class="segments">${[['system','system'],['light','light'],['dark','dark']].map(([v,key])=>`<button class="segment ${s.theme===v?'active':''}" data-theme="${v}">${h(L(key))}</button>`).join('')}</div></div><div class="setting-row"><div><label>${h(L('colour'))}</label><small>6 palettes</small></div><div class="palette-row">${Object.entries(PALETTES).map(([id,x])=>`<button class="swatch ${s.accent===id?'active':''}" title="${id}" aria-label="${id}" data-accent="${id}" style="background:${x[0]}">${s.accent===id?'✓':''}</button>`).join('')}<label class="custom-swatch ${s.accent==='custom'?'active':''}" title="Custom colour"><input type="color" id="custom-colour" value="${h(s.customAccent||'#176b5a')}" aria-label="Choose your own accent colour"></label></div></div><div class="setting-row"><div><label>${h(L('lang'))}</label></div><select class="select" id="language"><option value="ms" ${s.lang==='ms'?'selected':''}>Bahasa Melayu</option><option value="en" ${s.lang==='en'?'selected':''}>English</option></select></div></section><section class="settings-group"><h3>ᴀᴀ &nbsp; ${h(L('fontTitle'))}</h3><p>${h(L('fontHelp'))}</p><div class="size-box"><div class="label-line"><span>${h(L('arabicFont'))}</span><span id="arabic-val">${s.arabicSize}px</span></div><input id="arabic-slider" aria-label="Arabic font size" type="range" min="22" max="55" step="1" value="${s.arabicSize}"></div><div class="size-box"><div class="label-line"><span>${h(L('textFont'))}</span><span id="text-val">${s.textSize}px</span></div><input id="text-slider" aria-label="Translation font size" type="range" min="12" max="26" step="1" value="${s.textSize}"></div><div class="setting-preview"><div class="field-label" style="margin-top:0">${h(L('preview'))}</div><p class="arabic-text" lang="ar">رَبِّ زِدْنِي عِلْمًا</p><p class="translation-text">${h(s.lang==='ms'?'Wahai Tuhanku, tambahkanlah ilmuku.':'My Lord, increase me in knowledge.')}</p></div></section><section class="settings-group"><h3>▤ &nbsp; ${h(L('readerPreferences'))}</h3><p>${h(L('appearanceHelp'))}</p>${[['arabic','arabic'],['translation','translation'],['transliteration','transliteration'],['haptics','haptic']].map(([k,label])=>`<div class="setting-row"><label>${h(L(label))}</label><input type="checkbox" data-setting-checkbox="${k}" ${s[k]?'checked':''}></div>`).join('')}</section><section class="settings-group"><h3>◷ &nbsp; ${h(L('reminders'))}</h3><p>${h(L('remindersHelp'))}</p>${[['remindMorning','morningTime','morningReminder'],['remindEvening','eveningTime','eveningReminder']].map(([flag,time,label])=>`<div class="setting-row"><label>${h(L(label))}</label><div class="btn-row"><input type="time" class="input" data-time="${time}" value="${h(s[time])}" aria-label="${h(L(label))} time"><input type="checkbox" data-setting-checkbox="${flag}" ${s[flag]?'checked':''} aria-label="Enable reminder"></div></div>`).join('')}</section><section class="settings-group"><h3>⇩ &nbsp; ${h(L('backup'))}</h3><p>${h(L('backupHelp'))}</p><div class="btn-row"><button class="btn primary" data-export="settings">⇩ ${h(L('exportSettings'))}</button><button class="btn soft" data-export="full">⇩ ${h(L('exportAll'))}</button><button class="btn" data-import="1">⇧ ${h(L('import'))}</button></div></section><section class="settings-group"><h3>ⓘ &nbsp; ${h(L('about'))}</h3><p class="long-copy">${h(L('aboutText'))}</p><div class="long-copy"><b>${h(L('sourceCredit'))}:</b> Qur’an references; Sahih al-Bukhari, Sahih Muslim, Sunan Abi Dawud, Jamiʿ at-Tirmidhi. Sources for ongoing content verification: <a target="_blank" rel="noopener noreferrer" href="https://sunnah.com/">Sunnah.com</a>, <a target="_blank" rel="noopener noreferrer" href="https://tanzil.net/">Tanzil</a>, <a target="_blank" rel="noopener noreferrer" href="https://github.com/Seen-Arabic/Morning-And-Evening-Adhkar-DB">Seen-Arabic MIT-licensed adhkar dataset</a>. This app does not claim an official endorsement or a complete book edition.</div><div style="margin-top:19px"><button class="btn danger" data-clear="1">${h(L('clear'))}</button></div></section></div>`}
function render(){applySettings();renderNavigation();heading();const main=$('#main-content');main.innerHTML=page==='home'?renderHome():page==='library'?renderLibrary():page==='explore'?renderExplore():page==='saved'?renderSaved():page==='reader'?renderReader():page==='single'?renderSingle():page==='hisn-index'?renderHisnIndex():renderSettings();updateNetwork();}
function refreshReaderCounters(){if(page!=='reader'&&page!=='single')return;let c=page==='reader'?openCollection:'single:'+focusId;document.querySelectorAll('[data-entry]').forEach(card=>{let id=card.dataset.entry,it=LOOK[id];let n=amount(c,id);let el=card.querySelector('[data-count-display]');if(el)el.innerHTML=`${n} <span class="muted" style="font-size:13px">/ ${it.repeat}</span>`;let btn=card.querySelector('[data-increment]');if(btn){btn.disabled=n>=it.repeat;btn.textContent=n>=it.repeat?'✓ '+L('done'):'+1 '+L('count')}});if(page==='reader'){checkAutoFinish(c);let x=$('.progress-fill');if(x)x.style.width=progress(c)+'%';let t=$('.reader-layout')?.previousElementSibling;if(t?.classList.contains('tagline'))t.textContent=`${L('sessionProgress')}: ${progress(c)}%`}}
function stopSpeech(){try{window.speechSynthesis?.cancel()}catch(e){}}
function speak(id){if(!('speechSynthesis' in window))return toast('Speech synthesis not available on this device');stopSpeech();let ut=new SpeechSynthesisUtterance(LOOK[id].ar);ut.lang='ar-SA';ut.rate=.75;let voices=window.speechSynthesis.getVoices();let av=voices.find(v=>v.lang.toLowerCase().startsWith('ar'));if(av)ut.voice=av;speech=ut;window.speechSynthesis.speak(ut);toast(L('speechNote'))}
function updateSetting(name,v){if(!(name in DEFAULT.settings))return;state.settings[name]=v;save();applySettings()}
function downloadJSON(kind){let data={format:'dhikr-daily-backup',version:1,createdAt:new Date().toISOString(),kind,settings:state.settings};if(kind==='full')Object.assign(data,{bookmarks:state.bookmarks,custom:state.custom,history:state.history,sessions:state.sessions,last:state.last});const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`dhikr-daily-${kind}-${today()}.json`;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),1000);toast('Backup exported')}
function safeSettings(inp){if(!inp||typeof inp!=='object')throw Error('Settings not found');let s={...DEFAULT.settings};s.theme=['system','dark','light'].includes(inp.theme)?inp.theme:'system';s.accent=inp.accent==='custom'?'custom':PALETTES[inp.accent]?inp.accent:'emerald';s.customAccent=typeof inp.customAccent==='string'&&/^#[0-9a-f]{6}$/i.test(inp.customAccent)?inp.customAccent:'#176b5a';s.lang=['ms','en'].includes(inp.lang)?inp.lang:'ms';s.arabicSize=clamp(inp.arabicSize,22,55);s.textSize=clamp(inp.textSize,12,26);s.readerMode=['guided','continuous','memorise'].includes(inp.readerMode)?inp.readerMode:'guided';for(let key of ['arabic','translation','transliteration','haptics','remindMorning','remindEvening'])s[key]=typeof inp[key]==='boolean'?inp[key]:DEFAULT.settings[key];for(let key of ['morningTime','eveningTime'])s[key]=typeof inp[key]==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(inp[key])?inp[key]:DEFAULT.settings[key];return s}
async function importJSON(f){if(!f||f.size>3_000_000)return toast('Invalid or oversized backup file');try{let raw=JSON.parse(await f.text());if(raw.format!=='dhikr-daily-backup'||raw.version!==1||!['settings','full'].includes(raw.kind))throw Error('Unsupported backup format');let update={...state,settings:safeSettings(raw.settings)};if(raw.kind==='full'){if(!confirm('Replace current saved collections, bookmarks, history and settings with this full backup?'))return;update.bookmarks=Array.isArray(raw.bookmarks)?[...new Set(raw.bookmarks.filter(id=>typeof id==='string'&&LOOK[id]))].slice(0,ITEMS.length):[];update.custom=Array.isArray(raw.custom)?raw.custom.slice(0,40).filter(x=>x&&typeof x.name==='string'&&Array.isArray(x.items)).map((x,i)=>({id:(typeof x.id==='string'&&/^custom:[\w:-]{1,100}$/.test(x.id))?x.id:'custom:import-'+i+'-'+Date.now(),name:x.name.slice(0,60),ms:x.name.slice(0,60),icon:'custom',items:[...new Set(x.items.filter(id=>LOOK[id]))]})):[];const validCol=id=>Boolean(COLS.some(c=>c.id===id)||id==='bookmarks'||id?.startsWith('custom:')||id?.startsWith('single:'));update.history=Array.isArray(raw.history)?raw.history.filter(x=>x&&typeof x.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&typeof x.collection==='string').slice(-730):[];update.sessions=Object.create(null);if(raw.sessions&&typeof raw.sessions==='object'){for(let [k,v] of Object.entries(raw.sessions).slice(-1000)){if(!/^[\w:-]{1,120}$/.test(k))continue;if(!v||typeof v!=='object'||!v.counts||typeof v.counts!=='object')continue;let counts={};for(let[id,n]of Object.entries(v.counts))if(LOOK[id]&&Number.isFinite(n))counts[id]=Math.round(clamp(n,0,LOOK[id].repeat));update.sessions[k.slice(0,120)]={counts,completed:!!v.completed,updated:Date.now()}}}update.last=raw.last&&typeof raw.last.collection==='string'&&validCol(raw.last.collection)?{collection:raw.last.collection,index:clamp(raw.last.index,0,500),date:typeof raw.last.date==='string'?raw.last.date:today()}:null;if(update.last?.collection?.startsWith('custom:'))update.last=null}else{if(!confirm('Import appearance and reader settings? Other device data will be unchanged.'))return}state=update;save();navigate('settings');toast('Backup imported successfully')}catch(e){toast('Import failed: '+e.message)}finally{$('#import-file').value=''}}
function updateNetwork(){let online=navigator.onLine;let el=$('#network-state');if(el)el.textContent=(online?'● ':'◌ ')+L(online?'online':'offline')}
function checkReminders(){let d=new Date(),time=[String(d.getHours()).padStart(2,'0'),String(d.getMinutes()).padStart(2,'0')].join(':');for(let [flag,key,text] of [['remindMorning','morningTime','morning'],['remindEvening','eveningTime','evening']]){if(!state.settings[flag]||state.settings[key]!==time)continue;let k='reminded-'+text+'-'+today();if(sessionStorage.getItem(k))continue;sessionStorage.setItem(k,'1');toast(text==='morning'?colName(collection('morning')):colName(collection('evening')))}}
// Event delegation keeps listeners alive after changing routes.
document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;const d=t.dataset;
if(d.nav){navigate(d.nav);$('#sidebar').classList.remove('open');return}
if(d.open){startCollection(d.open,Number(d.index)||0);return}
if(d.single){startSingle(d.single);return}
if(d.tag){searchTag=d.tag;render();return}
if(d.quickTag){searchTerm='';searchTag=d.quickTag;navigate('explore');return}
if(d.savedtab){savedTab=d.savedtab;render();return}
if(d.fetchPack){fetchHisnPack();return}
if(d.hisnIndex){navigate('hisn-index');return}
if(d.bookmark){toggleBookmark(d.bookmark);return}
if(d.increment){increment(page==='reader'?openCollection:'single:'+focusId,d.increment);return}
if(d.resetCounter){resetCounter(page==='reader'?openCollection:'single:'+focusId,d.resetCounter);return}
if(d.mode){updateSetting('readerMode',d.mode);memoriseRevealed=false;render();return}
if(d.speak){speak(d.speak);return}
if(d.reveal){memoriseRevealed=true;render();return}
if(d.hide){memoriseRevealed=false;render();return}
if(d.prev){openIndex=Math.max(0,openIndex-1);memoriseRevealed=false;state.last={collection:openCollection,index:openIndex,date:today()};save();render();window.scrollTo(0,0);return}
if(d.next){let ids=collection(openCollection).items;if(openIndex>=ids.length-1)finishSession(openCollection);else{openIndex++;memoriseRevealed=false;state.last={collection:openCollection,index:openIndex,date:today()};save();render();window.scrollTo(0,0)}return}
if(d.sessionFinish){finishSession(d.sessionFinish);return}
if(d.resetSession){if(!confirm('Reset today’s counters for this collection?'))return;delete state.sessions[openCollection+':'+today()];save();render();return}
if(d.theme){updateSetting('theme',d.theme);render();return}
if(d.accent){updateSetting('accent',d.accent);render();return}
if(d.export){downloadJSON(d.export);return}
if(d.import){$('#import-file').click();return}
if(d.clear){if(!confirm(L('clearPrompt')))return;state.bookmarks=[];state.history=[];state.sessions={};state.last=null;save();render();toast('Reading data cleared');return}
if(d.deleteCustom){if(!confirm('Delete this personal collection?'))return;state.custom=state.custom.filter(x=>x.id!==d.deleteCustom);save();render();return}
if(d.addItem){if(!state.custom.length){savedTab='custom';navigate('saved');toast('Create a personal collection first');return}let options=state.custom.map((x,i)=>`${i+1}. ${x.name}`).join('\n');let answer=prompt('Choose a collection number:\n'+options,'1');if(answer===null)return;let c=state.custom[Number(answer)-1];if(!c)return toast('Invalid collection');if(!c.items.includes(d.addItem))c.items.push(d.addItem);save();toast('Added to '+c.name);return}
});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='language'){updateSetting('lang',t.value);render();return}if(t.id==='custom-colour'){updateSetting('customAccent',t.value);updateSetting('accent','custom');render();return}if(t.dataset.settingCheckbox){updateSetting(t.dataset.settingCheckbox,t.checked);return}if(t.dataset.visibility){updateSetting(t.dataset.visibility,t.checked);render();return}if(t.dataset.time){updateSetting(t.dataset.time,t.value);return}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='custom-colour'){updateSetting('customAccent',t.value);updateSetting('accent','custom');return}if(t.id==='search'){searchTerm=t.value;$('#explore-results').innerHTML=exploreResults();return}if(t.id==='arabic-slider'){let v=clamp(t.value,22,55);updateSetting('arabicSize',v);$('#arabic-val').textContent=v+'px';return}if(t.id==='text-slider'){let v=clamp(t.value,12,26);updateSetting('textSize',v);$('#text-val').textContent=v+'px';return}});
document.addEventListener('submit',e=>{if(e.target.id!=='custom-form')return;e.preventDefault();let name=$('#custom-name').value.trim();if(!name)return;let id='custom:'+Date.now().toString(36);state.custom.push({id,name,ms:name,icon:'custom',items:[]});save();render();toast('Collection created');});
let installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#install-btn').classList.remove('hidden')});
$('#install-btn').addEventListener('click',async()=>{if(!installPrompt)return;await installPrompt.prompt();installPrompt=null;$('#install-btn').classList.add('hidden')});
window.addEventListener('appinstalled',()=>{$('#install-btn').classList.add('hidden');installPrompt=null});
$('#import-file').addEventListener('change',e=>importJSON(e.target.files?.[0]));$('#quick-settings').addEventListener('click',()=>navigate('settings'));$('#menu-btn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));window.addEventListener('online',updateNetwork);window.addEventListener('offline',updateNetwork);document.addEventListener('keydown',e=>{if((page==='reader')&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){if(e.key==='ArrowRight'&&openIndex<collection(openCollection).items.length-1){openIndex++;render()}else if(e.key==='ArrowLeft'&&openIndex>0){openIndex--;render()}}});setInterval(checkReminders,30_000);checkReminders();
render();
if('serviceWorker'in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(()=>{}))}
})();

</script>
</body>
