 {id:'q201',name:'Good in this life and the next',ms:'Kebaikan dunia dan akhirat',ar:'رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ',en:'Our Lord, grant us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.',msText:'Wahai Tuhan kami, berikanlah kepada kami kebaikan di dunia dan kebaikan di akhirat, serta peliharalah kami daripada azab neraka.',tr:'Rabbanā ātinā fid-dunyā ḥasanatan wa fil-ākhirati ḥasanatan wa qinā ʿadhāban-nār.',ref:'Qur’an 2:201',kind:'quran',tags:['general','prayer','family'],repeat:1},

 {id:'q25',name:'Ease my task',ms:'Permudahkan urusanku',ar:'رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي وَاحْلُلْ عُقْدَةً مِنْ لِسَانِي يَفْقَهُوا قَوْلِي',en:'My Lord, expand my chest, ease my task for me, and untie the knot from my tongue so they may understand my speech.',msText:'Wahai Tuhanku, lapangkanlah dadaku, mudahkanlah urusanku dan lancarkanlah lidahku supaya mereka memahami ucapanku.',tr:'Rabbishraḥ lī ṣadrī, wa yassir lī amrī, waḥlul ʿuqdatan min lisānī, yafqahū qawlī.',ref:'Qur’an 20:25–28',kind:'quran',tags:['study','anxiety','work'],repeat:1},
 {id:'q87',name:'Prayer of Yunus',ms:'Doa Nabi Yunus',ar:'لَا إِلَٰهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ',en:'There is no god worthy of worship except You. Glory be to You! Indeed, I was among the wrongdoers.',msText:'Tiada Tuhan yang berhak disembah melainkan Engkau. Maha Suci Engkau! Sesungguhnya aku termasuk dalam kalangan orang yang zalim.',tr:'Lā ilāha illā anta subḥānaka innī kuntu minaẓ-ẓālimīn.',ref:'Qur’an 21:87',kind:'quran',tags:['anxiety','repentance','hardship'],repeat:1},
 {id:'q74',name:'Family and righteous descendants',ms:'Keluarga penyejuk mata',ar:'رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا',en:'Our Lord, grant us joy in our spouses and offspring, and make us an example for the righteous.',msText:'Wahai Tuhan kami, kurniakanlah kepada kami pasangan dan keturunan yang menyejukkan mata, dan jadikanlah kami teladan bagi orang yang bertakwa.',tr:'Rabbanā hab lanā min azwājinā wa dhurriyyātinā qurrata aʿyunin wajʿalnā lil-muttaqīna imāmā.',ref:'Qur’an 25:74',kind:'quran',tags:['family','children','general'],repeat:1},
 {id:'q8',name:'Keep our hearts steadfast',ms:'Tetapkan hati kami',ar:'رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ',en:'Our Lord, do not let our hearts deviate after You have guided us. Grant us mercy from Yourself. You are truly the Bestower.',msText:'Wahai Tuhan kami, janganlah Engkau pesongkan hati kami setelah Engkau memberi petunjuk; kurniakanlah rahmat daripada-Mu. Sesungguhnya Engkaulah Maha Pemberi.',tr:'Rabbanā lā tuzigh qulūbanā baʿda idh hadaytanā wa hab lanā min ladunka raḥmah, innaka antal-Wahhāb.',ref:'Qur’an 3:8',kind:'quran',tags:['faith','anxiety','general'],repeat:1},

 {id:'q24',name:'In need of Your goodness',ms:'Memohon segala kebaikan',ar:'رَبِّ إِنِّي لِمَا أَنْزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ',en:'My Lord, I am truly in need of whatever good You send down to me.',msText:'Wahai Tuhanku, sesungguhnya aku amat memerlukan apa jua kebaikan yang Engkau turunkan kepadaku.',tr:'Rabbi innī limā anzalta ilayya min khayrin faqīr.',ref:'Qur’an 28:24',kind:'quran',tags:['sustenance','hardship','general'],repeat:1},
 {id:'q173',name:'Allah is sufficient',ms:'Cukuplah Allah bagi kami',ar:'حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ',en:'Allah is sufficient for us, and He is the best Disposer of affairs.',msText:'Cukuplah Allah bagi kami, dan Dialah sebaik-baik tempat berserah.',tr:'Ḥasbunallāhu wa niʿmal-wakīl.',ref:'Qur’an 3:173',kind:'quran',tags:['anxiety','trust','hardship'],repeat:1},
 {id:'q43',name:'Supplication when travelling',ms:'Doa menaiki kenderaan',ar:'سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَٰذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَىٰ رَبِّنَا لَمُنْقَلِبُونَ',en:'Glory be to the One Who has subjected this to us, though we could not have controlled it ourselves, and to our Lord we shall surely return.',msText:'Maha Suci Dia yang memudahkan kenderaan ini untuk kami, sedangkan kami tidak mampu menguasainya sendiri; dan kepada Tuhan kami pasti kembali.',tr:'Subḥānal-ladhī sakhkhara lanā hādhā wa mā kunnā lahū muqrinīn, wa innā ilā rabbinā lamunqalibūn.',ref:'Qur’an 43:13–14',kind:'quran',tags:['travel','journey'],repeat:1},
 {id:'s01',name:'Before sleeping',ms:'Sebelum tidur',ar:'بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا',en:'In Your name, O Allah, I die and I live.',msText:'Dengan nama-Mu, ya Allah, aku mati dan aku hidup.',tr:'Bismika Allāhumma amūtu wa aḥyā.',ref:'Sahih al-Bukhari 6312',kind:'sunnah',tags:['sleep','night'],repeat:1},
 {id:'s02',name:'Upon waking',ms:'Bangun tidur',ar:'الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ',en:'All praise belongs to Allah Who gave us life after causing us to die, and to Him is the resurrection.',msText:'Segala puji bagi Allah yang menghidupkan kami setelah mematikan kami, dan kepada-Nya kebangkitan.',tr:'Al-ḥamdu lillāhil-ladhī aḥyānā baʿda mā amātanā wa ilayhin-nushūr.',ref:'Sahih al-Bukhari 6312',kind:'sunnah',tags:['morning','waking'],repeat:1},
 {id:'s03',name:'Before eating',ms:'Sebelum makan',ar:'بِسْمِ اللَّهِ',en:'In the name of Allah.',msText:'Dengan nama Allah.',tr:'Bismillāh.',ref:'Sahih al-Bukhari 5376; Sahih Muslim 2022',kind:'sunnah',tags:['food','daily'],repeat:1},
 {id:'s04',name:'Leaving the house',ms:'Keluar rumah',ar:'بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ',en:'In the name of Allah. I place my trust in Allah. There is no power and no strength except through Allah.',msText:'Dengan nama Allah. Aku bertawakal kepada Allah. Tiada daya dan kekuatan kecuali dengan pertolongan Allah.',tr:'Bismillāhi tawakkaltu ʿalallāh, wa lā ḥawla wa lā quwwata illā billāh.',ref:'Sunan Abi Dawud 5095; Jamiʿ at-Tirmidhi 3426',kind:'sunnah',tags:['travel','daily','home'],repeat:1},
 {id:'s05',name:'Entering the bathroom',ms:'Masuk tandas',ar:'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ',en:'O Allah, I seek refuge with You from male and female devils.',msText:'Ya Allah, aku berlindung kepada-Mu daripada syaitan jantan dan betina.',tr:'Allāhumma innī aʿūdhu bika minal-khubuthi wal-khabāʾith.',ref:'Sahih al-Bukhari 142; Sahih Muslim 375',kind:'sunnah',tags:['daily','home'],repeat:1},

 {id:'s10',name:'Remembrance of Allah',ms:'Zikir memuji Allah',ar:'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ',en:'Glory be to Allah and praise be to Him.',msText:'Maha Suci Allah dan segala puji bagi-Nya.',tr:'Subḥānallāhi wa biḥamdih.',ref:'Sahih al-Bukhari 6405; Sahih Muslim 2691 (100 times daily)',kind:'sunnah',tags:['dhikr','morning','evening','daily'],repeat:100},
 {id:'s11',name:'Protection in the evening',ms:'Perlindungan waktu petang',ar:'أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ',en:'I seek refuge in the perfect words of Allah from the evil of what He has created.',msText:'Aku berlindung dengan kalimah-kalimah Allah yang sempurna daripada kejahatan makhluk ciptaan-Nya.',tr:'Aʿūdhu bikalimātillāhit-tāmmāti min sharri mā khalaq.',ref:'Sahih Muslim 2709',kind:'sunnah',tags:['evening','protection','travel'],repeat:3},
 {id:'s12',name:'Morning reliance on Allah',ms:'Doa waktu pagi',ar:'اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ',en:'O Allah, by You we enter the morning and by You we enter the evening; by You we live and by You we die, and to You is the resurrection.',msText:'Ya Allah, dengan-Mu kami memasuki pagi dan petang, dengan-Mu kami hidup dan mati, dan kepada-Mu kebangkitan.',tr:'Allāhumma bika aṣbaḥnā wa bika amsaynā wa bika naḥyā wa bika namūtu wa ilaykan-nushūr.',ref:'Sunan Abi Dawud 5068; Jamiʿ at-Tirmidhi 3391',kind:'sunnah',tags:['morning','protection'],repeat:1},
 {id:'s13',name:'Evening reliance on Allah',ms:'Doa waktu petang',ar:'اللَّهُمَّ بِكَ أَمْسَيْنَا وَبِكَ أَصْبَحْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ الْمَصِيرُ',en:'O Allah, by You we enter the evening and by You we enter the morning; by You we live and by You we die, and to You is the return.',msText:'Ya Allah, dengan-Mu kami memasuki petang dan pagi, dengan-Mu kami hidup dan mati, dan kepada-Mu tempat kembali.',tr:'Allāhumma bika amsaynā wa bika aṣbaḥnā wa bika naḥyā wa bika namūtu wa ilaykal-maṣīr.',ref:'Sunan Abi Dawud 5068; Jamiʿ at-Tirmidhi 3391',kind:'sunnah',tags:['evening','protection'],repeat:1},
 {id:'s14',name:'Protection from harm',ms:'Memohon perlindungan',ar:'بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ',en:'In the name of Allah, with whose name nothing on earth or in heaven can cause harm, and He is the All-Hearing, All-Knowing.',msText:'Dengan nama Allah yang dengan nama-Nya tiada sesuatu di bumi atau langit dapat memberi mudarat; Dia Maha Mendengar lagi Maha Mengetahui.',tr:'Bismillāhil-ladhī lā yaḍurru maʿasmihi shayʾun fil-arḍi wa lā fis-samāʾi wa huwas-Samīʿul-ʿAlīm.',ref:'Sunan Abi Dawud 5088; Jamiʿ at-Tirmidhi 3388',kind:'sunnah',tags:['morning','evening','protection'],repeat:3},
 {id:'s15',name:'Seeking wellbeing',ms:'Memohon kesejahteraan',ar:'اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ',en:'O Allah, I ask You for pardon and wellbeing in this world and the Hereafter.',msText:'Ya Allah, aku memohon keampunan dan kesejahteraan di dunia dan di akhirat.',tr:'Allāhumma innī asʾalukal-ʿafwa wal-ʿāfiyata fid-dunyā wal-ākhirah.',ref:'Part of a longer supplication, Sunan Abi Dawud 5074',kind:'sunnah',tags:['morning','evening','health'],repeat:1,note:'Excerpt of the longer reported supplication; see the original narration for complete wording.'},
 {id:'q112',name:'Surah Al-Ikhlas',ms:'Surah Al-Ikhlas',ar:'قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ',en:'Say: He is Allah, the One; Allah, the Eternal Refuge. He neither begets nor is born, and there is none comparable to Him.',msText:'Katakanlah: Dialah Allah Yang Maha Esa; Allah tempat bergantung. Dia tidak beranak dan tidak diperanakkan, dan tiada sesuatu pun setara dengan-Nya.',tr:'Qul huwallāhu aḥad. Allāhuṣ-ṣamad. Lam yalid wa lam yūlad. Wa lam yakul-lahū kufuwan aḥad.',ref:'Qur’an 112:1–4; Abu Dawud 5082 (morning/evening recitation)',kind:'quran',tags:['morning','evening','sleep','protection'],repeat:3},
 {id:'q113',name:'Surah Al-Falaq',ms:'Surah Al-Falaq',ar:'قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ',en:'Say: I seek refuge in the Lord of daybreak, from the evil of what He created, the darkness when it settles, those who blow on knots, and an envier when he envies.',msText:'Katakanlah: Aku berlindung kepada Tuhan yang menguasai subuh, daripada kejahatan makhluk-Nya, kegelapan malam, para peniup pada simpulan, dan pendengki ketika dia dengki.',tr:'Qul aʿūdhu birabbil-falaq, min sharri mā khalaq, wa min sharri ghāsiqin idhā waqab, wa min sharrin-naffāthāti fil-ʿuqad, wa min sharri ḥāsidin idhā ḥasad.',ref:'Qur’an 113:1–5; Abu Dawud 5082 (morning/evening recitation)',kind:'quran',tags:['morning','evening','sleep','protection'],repeat:3},
 {id:'q114b',name:'Surah An-Nas',ms:'Surah An-Nas',ar:'قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ',en:'Say: I seek refuge in the Lord of mankind, the King of mankind, the God of mankind, from the evil of the retreating whisperer who whispers into hearts, from jinn and mankind.',msText:'Katakanlah: Aku berlindung kepada Tuhan manusia, Raja manusia, Sembahan manusia, daripada kejahatan pembisik yang bersembunyi, yang membisik ke dalam hati manusia, daripada jin dan manusia.',tr:'Qul aʿūdhu birabbin-nās, malikin-nās, ilāhin-nās, min sharril-waswāsil-khannās, alladhī yuwaswisu fī ṣudūrin-nās, minal-jinnati wan-nās.',ref:'Qur’an 114:1–6; Abu Dawud 5082 (morning/evening recitation)',kind:'quran',tags:['morning','evening','sleep','protection'],repeat:3}
];

const TAGS=[['all','all'],['morning','morning'],['evening','evening'],['quran','quran'],['sunnah','sunnah'],['sleep','sleep'],['after-salah','afterSalah'],['study','study'],['family','family'],['anxiety','anxiety'],['travel','travel']];
const normalized=x=>String(x||'').normalize('NFD').replace(/[\u064B-\u065F\u0670\u0640]/g,'').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ى/g,'ي');
const SEARCH_INTENTS=[
 [/exam|peperiksaan|ujian|study|belajar|school|sekolah|knowledge|ilmu|revision|ulang kaji/,['study','knowledge']],
 [/worried|worry|anxious|anxiety|stress|stressed|risau|bimbang|gelisah|sedih|distress|fear|takut|خوف|قلق/,['anxiety','hardship','trust']],
 [/hospital|sick|illness|health|kesihatan|sakit|sembuh|healing/,['health','protection']],
 [/mother|father|parent|ibu|bapa|ayah|family|keluarga|child|anak|husband|wife/,['parents','family','children']],
 [/trip|car|drive|travel|journey|musafir|perjalanan|kereta|kenderaan/,['travel','journey']],
 [/work|job|interview|kerja|tugas|speech|berucap/,['work','study']],
 [/bed|sleep|tidur|malam|night/,['sleep','night']],
 [/meal|food|makan|drink|eating/,['food']],
 [/repent|forgive|ampun|dosa|istighfar/,['repentance']],
 [/morning|pagi|subuh/,['morning','waking']],
 [/evening|petang|senja/,['evening']],
 [/prayer|salah|solat|namaz/,['after-salah','prayer']]
];
function matched(){
 const q=normalized(searchTerm);const intents=SEARCH_INTENTS.flatMap(([pattern,tags])=>pattern.test(q)?tags:[]);
 const words=q.split(/\s+/).filter(w=>w.length>=4&&!['about','untuk','yang','with','dalam','saya','from','want','need','when'].includes(w));
 return ITEMS.filter(x=>{
  if(searchTag!=='all'&&x.kind!==searchTag&&!x.tags.includes(searchTag))return false;
  if(!q)return true;
  const hay=normalized([x.name,x.ms,x.ar,x.en,x.msText,x.tr,x.ref,...x.tags].join(' '));
  return hay.includes(q)||intents.some(tag=>x.tags.includes(tag))||words.some(w=>hay.includes(w));
 });
}

function exploreResults(){return `<p class="tagline"><b>${matched().length}</b> ${h(L('results'))}</p><div class="item-list">${matched().length?matched().map((x,i)=>itemRow(x,i)).join(''):`<div class="empty-state">${h(L('empty'))}</div>`}</div>`}

function readerCard(it,c,idx,mode){const ck=c||'single:'+it.id,amt=amount(ck,it.id),saved=state.bookmarks.includes(it.id);const isMem=mode==='memorise';let visibleArabic=state.settings.arabic&&(!isMem||memoriseRevealed);return `<article class="reader-card" data-entry="${h(it.id)}"><div class="reader-top"><div><span class="pill">${it.kind==='quran'?'QUR’AN':it.kind==='hisn'?'HISN':it.kind==='mathurat'?'AL-MA’THURAT':'SUNNAH'} &nbsp; · &nbsp; ${it.repeat}×</span><h3 style="margin-top:12px">${h(getName(it))}</h3><p>${h(it.ref)}</p></div><div class="reader-tools"><button class="small-icon ${saved?'saved':''}" data-bookmark="${h(it.id)}" aria-label="Bookmark" title="Save">${saved?'★':'☆'}</button><button class="small-icon" data-copy-entry="${h(it.id)}" title="Copy du‘a" aria-label="Copy Arabic and meaning">⧉</button><button class="small-icon" data-speak="${h(it.id)}" title="${h(L('spoken'))}" aria-label="Speak Arabic">♫</button></div></div>${visibleArabic?`<div class="arabic-text" lang="ar" dir="rtl">${h(it.ar)}</div>`:isMem?`<div class="empty-state" style="padding:31px 14px"><button class="btn soft" data-reveal="1">${h(L('reveal'))}</button></div>`:''}${state.settings.transliteration?`<div class="translit">${h(it.tr)}</div>`:''}${state.settings.translation?`<div class="field-label">${h(L('translation'))}</div><p class="translation-text">${h(getMeaning(it)||L('translationPending'))}</p>`:''}<div class="source-line"><span class="source-review-badge">${it.kind==='quran'?'Qur’anic citation · check text':it.kind==='mathurat'?'Compiled dhikr · source review pending':'Narration · review pending'}</span><br><strong>${h(L('source'))}:</strong> ${h(it.ref)}${it.note?`<br>${h(it.note)}`:''}<div>${h(L('referenceNote'))}</div></div><div class="count-area"><div><small>${h(L('count'))}</small><span class="count-value" data-count-display="${h(it.id)}">${amt} <span class="muted" style="font-size:13px">/ ${it.repeat}</span></span></div><div class="btn-row"><button class="btn small" data-reset-counter="${h(it.id)}">↺</button><button class="btn primary" data-increment="${h(it.id)}" ${amt>=it.repeat?'disabled':''}>${amt>=it.repeat?'✓ '+h(L('done')):'+1 '+h(L('count'))}</button></div></div><div class="btn-row" style="margin-top:12px"><button class="btn small soft" data-add-item="${h(it.id)}">＋ ${h(L('addTo'))}</button>${isMem&&memoriseRevealed?`<button class="btn small" data-hide="1">${h(L('hide'))}</button>`:''}</div></article>`}

function refreshReaderCounters(){if(page!=='reader'&&page!=='single')return;let c=page==='reader'?openCollection:'single:'+focusId;document.querySelectorAll('[data-entry]').forEach(card=>{let id=card.dataset.entry,it=LOOK[id];let n=amount(c,id);let el=card.querySelector('[data-count-display]');if(el)el.innerHTML=`${n} <span class="muted" style="font-size:13px">/ ${it.repeat}</span>`;let btn=card.querySelector('[data-increment]');if(btn){btn.disabled=n>=it.repeat;btn.textContent=n>=it.repeat?'✓ '+L('done'):'+1 '+L('count')}});if(page==='reader'){checkAutoFinish(c);let x=$('.progress-fill');if(x)x.style.width=progress(c)+'%';let t=$('.reader-layout')?.previousElementSibling;if(t?.classList.contains('tagline'))t.textContent=`${L('sessionProgress')}: ${progress(c)}%`}}
function stopSpeech(){try{window.speechSynthesis?.cancel()}catch(e){}}
function speak(id){if(!('speechSynthesis' in window))return toast('Speech synthesis not available on this device');stopSpeech();let ut=new SpeechSynthesisUtterance(LOOK[id].ar);ut.lang='ar-SA';ut.rate=.75;let voices=window.speechSynthesis.getVoices();let av=voices.find(v=>v.lang.toLowerCase().startsWith('ar'));if(av)ut.voice=av;speech=ut;window.speechSynthesis.speak(ut);toast(L('speechNote'))}
function updateSetting(name,v){if(!(name in DEFAULT.settings))return;state.settings[name]=v;save();applySettings()}
function downloadJSON(kind){let data={format:'dhikr-daily-backup',version:1,createdAt:new Date().toISOString(),kind,settings:state.settings};if(kind==='full')Object.assign(data,{bookmarks:state.bookmarks,custom:state.custom,history:state.history,sessions:state.sessions,last:state.last});const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`dhikr-daily-${kind}-${today()}.json`;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),1000);toast('Backup exported')}
function safeSettings(inp){if(!inp||typeof inp!=='object')throw Error('Settings not found');let s={...DEFAULT.settings};s.theme=['system','dark','light'].includes(inp.theme)?inp.theme:'system';s.accent=inp.accent==='custom'?'custom':PALETTES[inp.accent]?inp.accent:'emerald';s.customAccent=typeof inp.customAccent==='string'&&/^#[0-9a-f]{6}$/i.test(inp.customAccent)?inp.customAccent:'#176b5a';s.lang=['ms','en'].includes(inp.lang)?inp.lang:'ms';s.arabicSize=clamp(inp.arabicSize,22,55);s.textSize=clamp(inp.textSize,12,26);s.readerMode=['guided','continuous','memorise'].includes(inp.readerMode)?inp.readerMode:'guided';s.arabicFont=['naskh','sans'].includes(inp.arabicFont)?inp.arabicFont:'naskh';s.dailyGoal=clamp(inp.dailyGoal,1,5);for(let key of ['arabic','translation','transliteration','haptics','remindMorning','remindEvening','autoAdvance','keepAwake','highContrast','reduceMotion'])s[key]=typeof inp[key]==='boolean'?inp[key]:DEFAULT.settings[key];for(let key of ['morningTime','eveningTime'])s[key]=typeof inp[key]==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(inp[key])?inp[key]:DEFAULT.settings[key];return s}
async function importJSON(f){if(!f||f.size>3_000_000)return toast('Invalid or oversized backup file');try{let raw=JSON.parse(await f.text());if(raw.format!=='dhikr-daily-backup'||raw.version!==1||!['settings','full'].includes(raw.kind))throw Error('Unsupported backup format');let update={...state,settings:safeSettings(raw.settings)};if(raw.kind==='full'){if(!confirm('Replace current saved collections, bookmarks, history and settings with this full backup?'))return;update.bookmarks=Array.isArray(raw.bookmarks)?[...new Set(raw.bookmarks.filter(id=>typeof id==='string'&&LOOK[id]))].slice(0,ITEMS.length):[];update.custom=Array.isArray(raw.custom)?raw.custom.slice(0,40).filter(x=>x&&typeof x.name==='string'&&Array.isArray(x.items)).map((x,i)=>({id:(typeof x.id==='string'&&/^custom:[\w:-]{1,100}$/.test(x.id))?x.id:'custom:import-'+i+'-'+Date.now(),name:x.name.slice(0,60),ms:x.name.slice(0,60),icon:'custom',items:[...new Set(x.items.filter(id=>LOOK[id]))]})):[];const validCol=id=>Boolean(COLS.some(c=>c.id===id)||id==='bookmarks'||id?.startsWith('custom:')||id?.startsWith('single:'));update.history=Array.isArray(raw.history)?raw.history.filter(x=>x&&typeof x.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&typeof x.collection==='string').slice(-730):[];update.sessions=Object.create(null);if(raw.sessions&&typeof raw.sessions==='object'){for(let [k,v] of Object.entries(raw.sessions).slice(-1000)){if(!/^[\w:-]{1,120}$/.test(k))continue;if(!v||typeof v!=='object'||!v.counts||typeof v.counts!=='object')continue;let counts={};for(let[id,n]of Object.entries(v.counts))if(LOOK[id]&&Number.isFinite(n))counts[id]=Math.round(clamp(n,0,LOOK[id].repeat));update.sessions[k.slice(0,120)]={counts,completed:!!v.completed,updated:Date.now()}}}update.last=raw.last&&typeof raw.last.collection==='string'&&validCol(raw.last.collection)?{collection:raw.last.collection,index:clamp(raw.last.index,0,500),date:typeof raw.last.date==='string'?raw.last.date:today()}:null;if(update.last?.collection?.startsWith('custom:'))update.last=null}else{if(!confirm('Import appearance and reader settings? Other device data will be unchanged.'))return}state=update;save();navigate('settings');toast('Backup imported successfully')}catch(e){toast('Import failed: '+e.message)}finally{$('#import-file').value=''}}
function updateNetwork(){let online=navigator.onLine;let el=$('#network-state');if(el)el.textContent=(online?'● ':'◌ ')+L(online?'online':'offline')}
function checkReminders(){let d=new Date(),time=[String(d.getHours()).padStart(2,'0'),String(d.getMinutes()).padStart(2,'0')].join(':');for(let [flag,key,text] of [['remindMorning','morningTime','morning'],['remindEvening','eveningTime','evening']]){if(!state.settings[flag]||state.settings[key]!==time)continue;let k='reminded-'+text+'-'+today();if(sessionStorage.getItem(k))continue;sessionStorage.setItem(k,'1');toast(text==='morning'?colName(collection('morning')):colName(collection('evening')))}}
// Event delegation keeps listeners alive after changing routes.
document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;const d=t.dataset;
if(d.nav){navigate(d.nav);$('#sidebar').classList.remove('open');return}
if(d.open){startCollection(d.open,Number(d.index)||0);return}
if(d.single){startSingle(d.single);return}
if(d.tag){searchTag=d.tag;render();return}
if(d.quickTag){searchTerm='';searchTag=d.quickTag;navigate('explore');return}
if(d.savedtab){savedTab=d.savedtab;render();return}
if(d.fetchPack){fetchHisnPack();return}
if(d.hisnIndex){navigate('hisn-index');return}
if(d.bookmark){toggleBookmark(d.bookmark);return}
if(d.copyEntry){copyText(d.copyEntry);return}
if(d.print){printReading();return}
if(d.share){shareReading();return}
if(d.wakelock){updateSetting('keepAwake',!state.settings.keepAwake);setWakeLock(state.settings.keepAwake);render();return}
if(d.updateApp){updateApp();return}
if(d.increment){increment(page==='reader'?openCollection:'single:'+focusId,d.increment);return}
if(d.resetCounter){resetCounter(page==='reader'?openCollection:'single:'+focusId,d.resetCounter);return}
if(d.mode){updateSetting('readerMode',d.mode);memoriseRevealed=false;render();return}
if(d.speak){speak(d.speak);return}
if(d.reveal){memoriseRevealed=true;render();return}
if(d.hide){memoriseRevealed=false;render();return}
if(d.prev){openIndex=Math.max(0,openIndex-1);memoriseRevealed=false;state.last={collection:openCollection,index:openIndex,date:today()};save();render();window.scrollTo(0,0);return}
if(d.next){let ids=collection(openCollection).items;if(openIndex>=ids.length-1)finishSession(openCollection);else{openIndex++;memoriseRevealed=false;state.last={collection:openCollection,index:openIndex,date:today()};save();render();window.scrollTo(0,0)}return}
if(d.sessionFinish){finishSession(d.sessionFinish);return}
if(d.resetSession){if(!confirm('Reset today’s counters for this collection?'))return;delete state.sessions[openCollection+':'+today()];save();render();return}
if(d.theme){updateSetting('theme',d.theme);render();return}
if(d.accent){updateSetting('accent',d.accent);render();return}
if(d.export){downloadJSON(d.export);return}
if(d.import){$('#import-file').click();return}
if(d.clear){if(!confirm(L('clearPrompt')))return;state.bookmarks=[];state.history=[];state.sessions={};state.last=null;save();render();toast('Reading data cleared');return}
if(d.deleteCustom){if(!confirm('Delete this personal collection?'))return;state.custom=state.custom.filter(x=>x.id!==d.deleteCustom);save();render();return}
if(d.addItem){if(!state.custom.length){savedTab='custom';navigate('saved');toast('Create a personal collection first');return}let options=state.custom.map((x,i)=>`${i+1}. ${x.name}`).join('\n');let answer=prompt('Choose a collection number:\n'+options,'1');if(answer===null)return;let c=state.custom[Number(answer)-1];if(!c)return toast('Invalid collection');if(!c.items.includes(d.addItem))c.items.push(d.addItem);save();toast('Added to '+c.name);return}
});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='language'){updateSetting('lang',t.value);render();return}if(t.id==='custom-colour'){updateSetting('customAccent',t.value);updateSetting('accent','custom');render();return}if(t.dataset.settingCheckbox){updateSetting(t.dataset.settingCheckbox,t.checked);return}if(t.dataset.visibility){updateSetting(t.dataset.visibility,t.checked);render();return}if(t.dataset.time){updateSetting(t.dataset.time,t.value);return}if(t.dataset.option){updateSetting(t.dataset.option,t.value);render();return}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='custom-colour'){updateSetting('customAccent',t.value);updateSetting('accent','custom');return}if(t.id==='search'){searchTerm=t.value;$('#explore-results').innerHTML=exploreResults();return}if(t.id==='chapter-search'){chapterQuery=t.value;const caret=t.selectionStart;render();const el=$('#chapter-search');el.focus();el.setSelectionRange(caret,caret);return}if(t.id==='arabic-slider'){let v=clamp(t.value,22,55);updateSetting('arabicSize',v);$('#arabic-val').textContent=v+'px';return}if(t.id==='text-slider'){let v=clamp(t.value,12,26);updateSetting('textSize',v);$('#text-val').textContent=v+'px';return}});
document.addEventListener('submit',e=>{if(e.target.id!=='custom-form')return;e.preventDefault();let name=$('#custom-name').value.trim();if(!name)return;let id='custom:'+Date.now().toString(36);state.custom.push({id,name,ms:name,icon:'custom',items:[]});save();render();toast('Collection created');});
let installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#install-btn').classList.remove('hidden')});
$('#install-btn').addEventListener('click',async()=>{if(!installPrompt)return;await installPrompt.prompt();installPrompt=null;$('#install-btn').classList.add('hidden')});
window.addEventListener('appinstalled',()=>{$('#install-btn').classList.add('hidden');installPrompt=null});
$('#import-file').addEventListener('change',e=>importJSON(e.target.files?.[0]));$('#quick-settings').addEventListener('click',()=>navigate('settings'));$('#menu-btn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));window.addEventListener('online',updateNetwork);window.addEventListener('offline',updateNetwork);document.addEventListener('keydown',e=>{if((page==='reader')&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){if(e.key==='ArrowRight'&&openIndex<collection(openCollection).items.length-1){openIndex++;render()}else if(e.key==='ArrowLeft'&&openIndex>0){openIndex--;render()}}});setInterval(checkReminders,30_000);checkReminders();
render();loadBundledHisn();
if('serviceWorker'in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(()=>{}))}
})();

</script>
