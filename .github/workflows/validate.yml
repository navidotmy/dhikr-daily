name: Validate Dhikr Daily
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check data.js
          node --check service-worker.js
      - name: Validate corpus, collections and offline assets
        run: node tests/sanity.mjs
